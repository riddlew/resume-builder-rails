services:
  db:
    image: postgres:18
    container_name:
    environment:
      - POSTGRES_DB=resume_builder
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
    volumes:
      - postgres_data:/var/lib/postgresql/
    ports:
      - "9992:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d resume_builder"]
      interval: 5s
      timeout: 5s

volumes:
  postgres_data: